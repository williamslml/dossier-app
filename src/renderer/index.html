<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossier</title>
    <style>
      /* Tokens de color (change 05-ajustes): una sola fuente de verdad para
         que el tema oscuro sea un cambio de variables, no de reglas sueltas
         por componente. El valor por defecto es el claro de siempre. */
      :root {
        --surface-app: #ffffff;
        --surface-subtle: #fafafa;
        --surface-muted: #f4f4f5;
        --surface-overlay: rgba(23, 23, 23, 0.45);

        --border: #eaeaea;
        --border-strong: #e5e5e5;
        --border-hover: #d4d4d4;

        --fg: #171717;
        --fg-subtle: #888888;
        --fg-faint: #a3a3a3;
        --fg-muted: #666666;
        --fg-muted-2: #525252;
        --fg-muted-3: #52525b;
        --fg-muted-4: #737373;
        --fg-inverse: #ffffff;

        --brand-fill: #171717;
        --brand-fill-hover: #383838;
        --brand-fill-active: #000000;

        --accent: #0070f3;

        --danger-fg: #e00;
        --danger-bg: #fff0f0;
        --danger-fg-2: #d00000;
        --danger-bg-2: #fff3f3;
        --danger-border-2: #ffd6d6;

        --status-dot-idle: #a3a3a3;
        --status-dot-ok: #16a34a;
        --status-dot-warn: #d97706;
      }

      :root[data-theme='oscuro'] {
        --surface-app: #0a0a0a;
        --surface-subtle: #141414;
        --surface-muted: #1f1f1f;
        --surface-overlay: rgba(0, 0, 0, 0.6);

        --border: #2a2a2a;
        --border-strong: #2e2e2e;
        --border-hover: #3a3a3a;

        --fg: #ededed;
        --fg-subtle: #9a9a9a;
        --fg-faint: #6b6b6b;
        --fg-muted: #a1a1a1;
        --fg-muted-2: #b4b4b4;
        --fg-muted-3: #b0b0b5;
        --fg-muted-4: #a3a3a3;
        --fg-inverse: #0a0a0a;

        --brand-fill: #ededed;
        --brand-fill-hover: #c7c7c7;
        --brand-fill-active: #ffffff;

        --accent: #3b9dff;

        --danger-fg: #ff6b6b;
        --danger-bg: #3a1414;
        --danger-fg-2: #ff8080;
        --danger-bg-2: #3a1414;
        --danger-border-2: #5c2323;

        --status-dot-idle: #6b6b6b;
        --status-dot-ok: #22c55e;
        --status-dot-warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          'Geist',
          -apple-system,
          BlinkMacSystemFont,
          'Inter',
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--surface-subtle);
        background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
        background-size: 20px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      svg {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }

      /* Ventana compacta estilo Geist / Vercel Light */
      .app-window {
        width: 390px;
        height: 620px;
        background-color: var(--surface-app);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.06),
          0 2px 6px rgba(0, 0, 0, 0.03);
        position: relative;
      }

      /* Barra superior */
      .title-bar {
        height: 54px;
        background-color: var(--surface-subtle);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        -webkit-app-region: drag;
      }
      .title-bar-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .title-bar-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .title-bar-subtitle {
        font-size: 10.5px;
        color: var(--fg-subtle);
        line-height: 1.2;
      }
      .title-bar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: -0.01em;
      }
      .title-bar-right {
        display: flex;
        align-items: center;
        gap: 6px;
        -webkit-app-region: no-drag;
      }
      .btn-header-clone {
        font-size: 11px;
        background-color: var(--surface-app);
        color: var(--fg);
        border: 1px solid var(--border-strong);
        padding: 3px 9px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-header-clone:hover {
        background-color: var(--surface-muted);
        border-color: var(--fg);
      }
      .vault-badge {
        font-size: 10.5px;
        background-color: var(--surface-app);
        color: var(--fg-muted-2);
        border: 1px solid var(--border-strong);
        padding: 3px 8px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 500;
      }

      /* Contenedor principal */
      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px;
        overflow-y: auto;
        background-color: var(--surface-app);
      }
      .sessions-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }


      /* Lista de tarjetas de cuentas */
      .account-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .account-card {
        background-color: var(--surface-app);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .account-card:hover {
        background-color: var(--surface-subtle);
        border-color: var(--fg);
      }
      .account-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .account-info {
        min-width: 0;
      }
      .account-info h4 {
        font-size: 13px;
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 2px;
      }
      .account-label-input {
        width: 100%;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--fg);
        background-color: var(--surface-subtle);
        border: 1px solid var(--fg);
        border-radius: 4px;
        padding: 1px 4px;
        margin-bottom: 2px;
        font-family: inherit;
      }
      .account-meta {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--fg-muted);
      }
      .tag-custom {
        background-color: var(--surface-muted);
        color: var(--fg-muted-3);
        padding: 2px 7px;
        border-radius: 5px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .icon-action-btn {
        background: transparent;
        border: none;
        color: var(--fg-subtle);
        cursor: pointer;
        padding: 4px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .icon-action-btn:hover {
        color: var(--fg);
        background-color: var(--surface-muted);
      }
      .icon-action-btn.delete:hover {
        color: var(--danger-fg);
        background-color: var(--danger-bg);
      }

      .account-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      /* Botones de acción principales */
      .add-buttons {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 14px;
      }
      .btn-row-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .btn-add {
        width: 100%;
        height: 35px;
        padding: 0 11px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition: all 0.15s ease;
      }
      .btn-add:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      /* GitHub/GitLab/Clonar: mismo estilo los tres — fondo blanco fijo,
         nunca reactivo al tema. Son botones de identidad de proveedor (como
         "Sign in with GitHub" en cualquier app), no deberían cambiar con la
         preferencia de tema de quien los mira. */
      .btn-gh,
      .btn-gl,
      .btn-clone-full {
        background-color: #ffffff;
        color: #171717;
        border: 1px solid #eaeaea;
      }
      .btn-gh:hover:not(:disabled),
      .btn-gl:hover:not(:disabled),
      .btn-clone-full:hover:not(:disabled) {
        background-color: #fafafa;
        border-color: #d4d4d4;
      }

      /* Notificación discreta de estado */
      .toast-feedback {
        margin-top: auto;
        padding-top: 12px;
      }
      .toast-box {
        background-color: var(--surface-subtle);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 11px;
        color: var(--fg-muted-2);
        display: flex;
        align-items: center;
        gap: 8px;
        line-height: 1.4;
      }
      .toast-box svg {
        color: var(--accent);
      }

      /* Pie de aplicación */
      .app-footer {
        height: 30px;
        background-color: var(--surface-subtle);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        font-size: 10.5px;
        color: var(--fg-muted-4);
      }
      .footer-helper {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .footer-status {
        display: flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        padding: 0;
        cursor: pointer;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--status-dot-idle);
      }
      .status-dot--ok {
        background-color: var(--status-dot-ok);
      }
      .status-dot--warn {
        background-color: var(--status-dot-warn);
      }
      .status-dot--error {
        background-color: var(--danger-fg);
      }

      /* Estado vacío (S5.3 — nuevo, el prototipo no lo contemplaba) */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        padding: 24px;
        border: 1px dashed var(--border-hover);
        border-radius: 10px;
      }
      .empty-state-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: var(--surface-muted);
        color: var(--fg-faint);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty-state-hint {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--fg-muted);
        margin-top: -4px;
      }
      .sessions-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        color: var(--fg);
        margin-bottom: 8px;
      }
      .sessions-count {
        font-weight: 500;
        color: var(--fg);
      }

      /* Pantalla de Ajustes (change 05-ajustes) */
      .ajustes-screen {
        gap: 20px;
      }
      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .settings-section h3 {
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-subtle);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .doctor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .doctor-recheck {
        font-size: 11px;
        padding: 4px 9px;
      }
      .doctor-empty {
        font-size: 12px;
        color: var(--fg-muted);
      }
      .doctor-detail {
        font-size: 11px;
        color: var(--danger-fg);
      }
      .doctor-icon-ok {
        color: var(--status-dot-ok);
        flex-shrink: 0;
      }
      .doctor-icon-error {
        color: var(--danger-fg);
        flex-shrink: 0;
      }
      .theme-options {
        display: flex;
        flex-direction: row;
        gap: 8px;
      }
      .theme-option {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background-color: var(--surface-app);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 8px;
        font-size: 12.5px;
        color: var(--fg);
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
      }
      .theme-option:hover {
        background-color: var(--surface-subtle);
        border-color: var(--border-hover);
      }
      .theme-option.selected {
        background-color: var(--brand-fill);
        border-color: var(--brand-fill);
        color: var(--fg-inverse);
        font-weight: 600;
      }
      .settings-group {
        display: flex;
        flex-direction: column;
        background-color: var(--surface-app);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .settings-toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--fg);
        cursor: pointer;
      }
      .settings-group .settings-toggle-row,
      .settings-group .shortcut-row {
        border-radius: 0;
      }
      .settings-group > * + * {
        border-top: 1px solid var(--border);
      }
      .shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
      }
      .shortcut-row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .shortcut-row-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
      }
      .shortcut-row-hint {
        font-size: 11.5px;
        color: var(--fg-muted);
      }
      .keycaps {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .keycaps span {
        color: var(--fg-faint);
        font-size: 11px;
      }
      .key {
        font-size: 11px;
        font-weight: 600;
        color: var(--fg);
        background-color: var(--surface-subtle);
        border: 1px solid var(--border-hover);
        border-radius: 5px;
        padding: 3px 7px;
      }
      .about-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        /* Siempre pegado abajo, justo encima del footer — no al final del
           contenido si alcanza a dejar hueco (p. ej. sin credenciales
           huérfanas que mostrar). El `gap` de `.ajustes-screen` ya separa
           del elemento anterior cuando no hay hueco de sobra. */
        margin-top: auto;
      }
      .about-row-label {
        font-size: 12.5px;
        color: var(--fg-muted);
      }
      .about-row-value {
        font-size: 12.5px;
        color: var(--fg);
      }
      .toggle-switch {
        appearance: none;
        width: 34px;
        height: 20px;
        border-radius: 9999px;
        background-color: var(--border-hover);
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }
      .toggle-switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: var(--surface-app);
        transition: transform 0.15s ease;
      }
      .toggle-switch:checked {
        background-color: var(--brand-fill);
      }
      .toggle-switch:checked::after {
        transform: translateX(14px);
      }
      .settings-about {
        font-size: 12px;
        color: var(--fg-muted);
      }
      .pins-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pin-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background-color: var(--surface-app);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .pin-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .pin-path {
        font-size: 12px;
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pin-account {
        font-size: 11px;
        color: var(--fg-muted);
      }
      .pin-add-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: var(--surface-subtle);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
      .pin-add-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .pin-add-actions button {
        height: 30px;
        padding: 0 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }

      /* Diálogos de vincular cuenta (nuevo, no estaba en el prototipo) */
      .dialog-overlay {
        position: absolute;
        inset: 0;
        background-color: var(--surface-overlay);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
      }
      .dialog-card {
        width: 100%;
        max-width: 300px;
        background-color: var(--surface-app);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow:
          0 12px 32px rgba(0, 0, 0, 0.12),
          0 2px 6px rgba(0, 0, 0, 0.06);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .dialog-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--fg);
      }
      .dialog-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .dialog-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .dialog-field label {
        font-size: 11.5px;
        color: var(--fg-muted-2);
        font-weight: 500;
      }
      .cli-import-banner {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background-color: var(--surface-subtle);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        color: var(--fg-muted);
      }
      .dialog-input {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--fg);
        background-color: var(--surface-subtle);
      }
      .dialog-input:focus {
        outline: none;
        border-color: var(--fg);
        background-color: var(--surface-app);
      }
      .dialog-error {
        font-size: 11.5px;
        color: var(--danger-fg-2);
        background-color: var(--danger-bg-2);
        border: 1px solid var(--danger-border-2);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .conflict-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .conflict-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .conflict-card p {
        line-height: 1.4;
      }
      .dialog-hint {
        font-size: 11.5px;
        color: var(--fg-muted);
        text-align: center;
      }
      .dialog-link-button {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 500;
        color: var(--fg);
        text-decoration: underline;
        cursor: pointer;
      }
      .btn-primary {
        background-color: var(--brand-fill);
        color: var(--fg-inverse);
        border: none;
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--brand-fill-active);
      }
      .btn-secondary {
        background-color: var(--surface-app);
        color: var(--fg);
        border: 1px solid var(--border-strong);
      }
      .btn-secondary:hover {
        background-color: var(--surface-muted);
      }
      .device-code-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .device-code {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--fg);
