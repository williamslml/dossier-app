name: Release

# Fase 5 (docs/product.md §5, 08-release-pipeline): dispara con un tag v*,
# nunca con un push a una rama. Deja la release en GitHub como BORRADOR
# (default de electron-builder cuando no se fija `releaseType` — ver
# requirements.md R1.2) - publicarla es un paso manual, no lo hace este
# workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # necesario para que electron-builder cree la release (borrador)

jobs:
  release:
    name: Build + publicar (borrador)
    runs-on: windows-latest # solo Windows - el instalador real, no la matriz de ci.yml
    env:
      RTK_DISABLED: '1' # comandos de evidencia de SFP, sin comprimir (CLAUDE.md)
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # electron-builder lo busca con este nombre
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm electron-vite build

      # Hallazgo real (probado con un tag de prueba): electron-builder usa
      # la versión de package.json para nombrar la release, no el tag que
      # disparó el workflow — si no coinciden, crea una release "untagged"
      # nueva en vez de encontrar/actualizar la que corresponde al tag. Se
      # fuerza la versión acá a partir del tag real (`v1.2.3` → `1.2.3`).
      - name: Derivar la versión del tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Hallazgo real (mismo tag de prueba): el runner de Windows corre
      # `run:` con PowerShell por default, y ahí `-c.extraMetadata.version=X`
      # (el flag de electron-builder que normalmente setea esto) se parsea
      # distinto que en bash — electron-builder lo interpretó como un path
      # de config inexistente y falló. Más simple y portable entre shells:
      # escribir la versión directo en package.json (en el checkout
      # temporal del runner, nunca en el repo) antes de construir.
      - name: Fijar la versión del tag en package.json
        shell: bash
        run: npm pkg set version="$RELEASE_VERSION"

      # Hallazgo real (mismo tag de prueba): `--publish always` de
      # electron-builder sube cada artefacto con su propio "publisher" en
      # paralelo, y cada uno decide por su cuenta si la release ya existe —
      # con dos o más artefactos, una carrera hace que más de uno piense
      # "no existe" al mismo tiempo y cree una release cada uno (visto en
      # los logs reales: "creating GitHub release" aparece dos veces para
      # el mismo tag). Más simple y confiable: construir sin publicar, y
      # crear la release + subir los artefactos en un solo paso atómico con
      # `gh release create` (nunca paraleliza su propia subida de archivos).
      #
      # Hallazgo real (otro tag de prueba): sacar el `--publish` del
      # comando NO alcanza — electron-builder loguea "Implicit publishing
      # triggered by git tag" y publica solo cuando corre contra un tag de
      # git con GH_TOKEN presente, aunque no se le pida. Hace falta
      # `--publish never` explícito para desactivar ese default (que el
      # propio electron-builder ya avisa que va a quitar en su v27).
      - run: pnpm electron-builder --win --publish never

      # Hallazgo real (probado de punta a punta con electron-updater de
      # verdad, no solo revisando que la release quede bien formada): GitHub
      # reemplaza los espacios del nombre de archivo por PUNTOS al subir un
      # asset de release — pero `latest.yml` (que genera electron-builder) y
      # electron-updater esperan GUIONES (`Dossier-Setup-X.exe`, no
      # `Dossier.Setup.X.exe`). Con el nombre original (con espacios) la
      # release quedaba bien, pero la descarga real del update fallaba con
      # 404. Fix: renombrar los archivos a guiones antes de subirlos, para
      # que coincidan exactamente con lo que `latest.yml` declara.
      - name: Renombrar los artefactos con guiones (no espacios)
        shell: bash
        run: |
          mv "release/Dossier Setup ${RELEASE_VERSION}.exe" "release/Dossier-Setup-${RELEASE_VERSION}.exe"
          mv "release/Dossier Setup ${RELEASE_VERSION}.exe.blockmap" "release/Dossier-Setup-${RELEASE_VERSION}.exe.blockmap"

      - name: Crear la release en borrador con los artefactos
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Build automático sin firmar — Fase 5 (08-release-pipeline)." \
            "release/Dossier-Setup-${RELEASE_VERSION}.exe" \
            "release/Dossier-Setup-${RELEASE_VERSION}.exe.blockmap" \
            release/latest.yml
