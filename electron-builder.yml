# S4.4 (docs/adr/0006-seguridad.md): fuses de producción, dejados correctos
# desde ya aunque el build de instalador real sea Fase 5. appId (ADR 0005).
appId: com.dossier.app
productName: Dossier
directories:
  output: release
files:
  - out/**/*
  # Hallazgo real (probado con un build empaquetado de verdad, no en modo
  # dev): sin esto, resources/ no entra al .asar — src/main/index.ts resuelve
  # el ícono con una ruta relativa a import.meta.url que espera encontrarla
  # ahí. Sin el archivo, electron-menubar cae a su propio ícono por default,
  # y esa rama (lib/index.mjs) usa `__dirname`, que no existe en ESM real —
  # revienta el arranque entero de la bandeja, no solo el ícono.
  - resources/**/*
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: nsis
  icon: resources/app-icon.ico
# R1 (08-release-pipeline): necesario para `electron-builder --publish` y
# para que `electron-updater` sepa contra qué repo chequear. `releaseType`
# no se fija a mano: el default de electron-builder ya es "draft" (nunca
# una release publicada sola), que es justo lo que pide proposal.md.
publish:
  provider: github
  owner: williamslml
  repo: dossier-app
