# S4.4 (docs/adr/0006-seguridad.md): fuses de producción, dejados correctos
# desde ya aunque el build de instalador real sea Fase 5. appId (ADR 0005).
appId: com.dossier.app
productName: Dossier
directories:
  output: release
files:
  - out/**/*
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target: nsis
  icon: resources/app-icon.ico
# R1 (08-release-pipeline): necesario para `electron-builder --publish` y
# para que `electron-updater` sepa contra qué repo chequear. `releaseType`
# no se fija a mano: el default de electron-builder ya es "draft" (nunca
# una release publicada sola), que es justo lo que pide proposal.md.
publish:
  provider: github
  owner: williamslml
  repo: dossier-app
